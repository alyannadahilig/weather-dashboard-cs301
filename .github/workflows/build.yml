
name: Build Weather Dashboard

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build project
        run: gradle build

      - name: Create fat JAR
        run: gradle shadowJar

      - name: Upload fat JAR
        uses: actions/upload-artifact@v4
        with:
          name: weather-dashboard
          path: build/libs/weather-dashboard-all.jar
